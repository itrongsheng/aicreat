[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicreat-server"
version = "0.1.0"
description = "aicreat AI 内容生成与效果监控平台后端（FastAPI + app.worker + app.monitor_worker）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "gunicorn>=21.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pymysql>=1.1",
  "redis>=5.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "bcrypt>=4.0",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "boto3>=1.34",
  "google-auth>=2.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
