# Alembic 配置（在 server/ 目录执行 `alembic upgrade head`）。
# 连接串不写在这里：migrations/env.py 从 app.core.config.settings.database_url（环境变量 DATABASE_URL / server/.env）读取。

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 迁移文件名：0001_initial.py 形式（revision id 即四位序号）
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
